name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Stamp the build id into the page (cache-busting for scripts and styles)
        run: sed -i "s/?v=BUILD/?v=${GITHUB_SHA::8}/g" index.html

      - name: Set up Pages (enables Pages for the repo if it is not on yet)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site (the repository root is the site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
